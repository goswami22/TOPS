{% extends 'base.html' %}

{% block title %}Delete Post | WriteSphere{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 50vh;">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-5 text-center">
            <i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
            <h3 class="fw-bold mt-4 mb-3">Delete Post?</h3>
            <p class="text-secondary mb-4">Are you sure you want to delete the post "<strong>{{ post.title }}</strong>"? This action cannot be undone.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'blog:post_detail' post.slug %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger rounded-pill px-4">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
