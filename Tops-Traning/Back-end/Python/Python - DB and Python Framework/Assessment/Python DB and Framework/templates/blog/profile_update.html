{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit Profile | WriteSphere{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-5">
            <div class="text-center mb-4">
                <i class="bi bi-pencil-square fs-1 text-primary"></i>
                <h2 class="fw-bold mt-2">Edit Profile</h2>
                <p class="text-secondary">Update your username, email, bio, or profile picture.</p>
            </div>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
