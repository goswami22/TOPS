{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ title }} | WriteSphere{% endblock %}

{% block extra_js %}
<!-- CKEditor Media from form -->
{{ form.media }}
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="glass-card p-4 p-md-5">
            <div class="d-flex align-items-center mb-4">
                <h2 class="fw-bold m-0">{{ title }}</h2>
                {% if post %}
                <a href="{% url 'blog:post_detail' post.slug %}" class="btn btn-outline-secondary ms-auto rounded-pill px-4">Cancel</a>
                {% endif %}
            </div>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-flex justify-content-end mt-4">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5"><i class="bi bi-save"></i> Save Post</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
