{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login | WriteSphere{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-5">
            <div class="text-center mb-4">
                <i class="bi bi-door-open fs-1 text-primary"></i>
                <h2 class="fw-bold mt-2">Welcome Back</h2>
                <p class="text-secondary">Log in to your WriteSphere account.</p>
            </div>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill">Log In</button>
                </div>
            </form>
            <div class="text-center mt-4">
                <p class="small text-muted">Don't have an account? <a href="{% url 'blog:register' %}" class="fw-bold text-decoration-none text-primary">Sign Up</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
