<!DOCTYPE html>
<html>
<head>
    <title>Doctor List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 class="mb-3">Doctor List</h2>

<!-- Search -->
<form method="GET" class="mb-3">
    <input type="text" name="q" placeholder="Search specialization" class="form-control">
</form>

<a href="{% url 'add_doctor' %}" class="btn btn-success mb-3">Add Doctor</a>

<table class="table table-bordered">
    <tr>
        <th>Name</th>
        <th>Specialization</th>
        <th>Experience</th>
        <th>Hospital</th>
        <th>Actions</th>
    </tr>

    {% for doctor in doctors %}
    <tr>
        <td>{{ doctor.name }}</td>
        <td>{{ doctor.specialization }}</td>
        <td>{{ doctor.experience }}</td>
        <td>{{ doctor.hospital }}</td>
        <td>
            <a href="{% url 'edit_doctor' doctor.id %}" class="btn btn-warning btn-sm">Edit</a>
            <a href="{% url 'delete_doctor' doctor.id %}" class="btn btn-danger btn-sm">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
