{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Finder - Premium Maps</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'map_app/css/style.css' %}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar for Doctor Listings -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <h1><i class="fa-solid fa-stethoscope"></i> Doctor Finder</h1>
                <p>Find top-rated specialists near you</p>
                <div class="search-bar">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search by name or specialty...">
                </div>
            </header>
            
            <div class="doctor-list" id="doctorList">
                <!-- Doctor cards will be dynamically injected here via JS -->
            </div>
        </aside>

        <!-- Main Map Area -->
        <main class="map-section">
            <div id="map"></div>
            <!-- Loading overlay before map initializes -->
            <div id="map-loading" class="map-loading active">
                <div class="loader"></div>
                <p>Loading Map...</p>
            </div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Application Script -->
    <script src="{% static 'map_app/js/script.js' %}"></script>

</body>
</html>
