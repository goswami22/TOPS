<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paytm Payment Gateway - Checkout</title>
    <style>
        :root {
            --primary: #00BAF2;
            --secondary: #002970;
            --bg: #f8f9fa;
            --white: #ffffff;
            --text: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 400px;
            background: var(--white);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h2 {
            color: var(--secondary);
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .pay-btn {
            width: 100%;
            background-color: var(--primary);
            color: var(--white);
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .pay-btn:hover {
            background-color: #0096cc;
        }

        .paytm-logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .paytm-logo img {
            width: 130px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="paytm-logo">
            <img src="https://static01.nyt.com/images/2022/01/17/business/17india-paytm-1/17india-paytm-1-mediumThreeByTwo440.jpg" alt="Paytm Logo">
        </div>
        <h2>Secure Checkout</h2>
        <form action="/initiate_payment/" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" placeholder="Enter email" required>
            </div>
            <div class="form-group">
                <label for="amount">Order Amount (INR)</label>
                <input type="number" name="amount" id="amount" placeholder="Enter amount" value="100.00" step="0.01" required>
            </div>
            <button type="submit" class="pay-btn">Proceed to Pay</button>
        </form>
    </div>
</body>
</html>
