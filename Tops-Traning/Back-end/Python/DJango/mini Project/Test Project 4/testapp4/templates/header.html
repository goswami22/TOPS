<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" >
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" ></script>
    <title>Tops Teechnologies</title>
    <style>
               body {
    background: linear-gradient(120deg, #fdfbfb, #ebedee);
}

/* Contact Card */
h1 {
    text-align: center;
}
.contact-card {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
}

/* Heading */
.contact-card h2 {
    color: #2c3e50;
}

/* Inputs */
.form-control {
    border-radius: 12px;
    padding: 12px 15px;
    border: 1px solid #ddd;
    transition: 0.3s;
}

.form-control:focus {
    border-color: #6c63ff;
    box-shadow: 0 0 0 0.2rem rgba(108, 99, 255, 0.25);
}

/* Gradient Button */
.btn-gradient {
    background: linear-gradient(135deg, #6c63ff, #48c6ef);
    border: none;
    border-radius: 14px;
    padding: 12px;
    font-weight: 600;
    transition: 0.3s ease;
}

.btn-gradient:hover {
    transform: translateY(-3px);
    opacity: 0.95;
}
    </style>
</head>
<body>
    
    <nav class="navbar navbar-expand-lg bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Tops Teechnologies</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'contact' %}" name="contact">Contact</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Courses
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Python</a></li>
            <li><a class="dropdown-item" href="#">Jave</a></li>
            <li><a class="dropdown-item" href="#">Data Science</a></li>
          </ul>
        </li>
      </ul>
      <ul class="navbar-nav">
      {% if request.session.email %}
         <li class="nav-item">
            <a class="nav-link" href="{% url 'logout' %}" name="logout">logout({{request.session.fname}})</a>
         </li>
         <li class="nav-item">
            <a class="nav-link" href="{% url 'change_password' %}" name="change-password">Change password</a>
         </li>
    
        {% else %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'signup' %}" name="signup">sign up</a>
            
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'login' %}" name="login">login </a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
{% block content %}
{% endblock %}
</body>
</html>
