{% extends 'header.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>change password</title>
</head>
<body>
    <h1>Change Password</h1>

    <div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="contact-card p-4 p-md-5">
                {% if msg %}
                    <p style="color: green; font-size: 16px; font-weight: 600;">{{msg}}</p>
                {% endif %}

                <form method="post" name="Change_Password" action="{% url 'change_password' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Old Password</label>
                        <input type="password" name="old_password" class="form-control" placeholder="Enter password" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" name="new_password" class="form-control" placeholder="Enter password" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Enter password" required>
                    </div>


                    <div class="d-grid">
                        <button type="submit" class="btn btn-gradient btn-lg text-white">
                            Change Password
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
    

</body>
</html>
{% endblock %}
