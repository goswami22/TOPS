{% extends 'header.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
</head>
<body>
    <h1>User Login</h1>
    {% if msg %}
        <p style="color: Green; font-size:  18px; text-align: center; text-transform: capitalize;">{{msg}}</p>
    {% endif %}
    <center>
    <div class="login-form">
        <form action="{% url 'login' %}" method="post" name="login">
            {% csrf_token %}
            <table>
                <tr>
                    <td class="form-label" for="email">Email:</td>
                    <td><input type="text" id="email" class="form-control" name="email"></td>
                </tr>
                <tr>
                    <td class="form-label" for="password">password:</td>
                    <td><input type="password" id="password" class="form-control" name="password"></td>
                </tr>
                <tr>
                    <td><input type="submit" class="btn btn-primary" value="login"></td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
{% endblock %}
