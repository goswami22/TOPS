<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" >
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <title>Top Technologies</title>
    <style>
        table {
            tr, td{padding-bottom:15px ;}
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Tops Technologies</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'contact' %}">Contact</a>
        </li>
      </ul>
       <ul class="navbar-nav ms-auto">
        {% if request.session.email %}
        <li class="nav-item ">
            <li class="nav-item">
                <a class="nav-link" href="{% url 'logout'%}">logout({{request.session.fname}})</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'change-password'%}">change password</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'profile'%}">profile</a>
            </li>
        {% else %}
            <li class="nav-item ">
                <a class="nav-link" href="{% url 'signup'%}">signup</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'login'%}">login</a>
            </li>
        {% endif %}
            
        </ul>
    </div>
  </div>
</nav>

{% block content %}
{% endblock %}

</body>
</html>
