

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tops Technologies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }
        .container {
            padding-block: 80px 3px; 
        }
        .contact-card {
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #764ba2;
        }
        .btn-custom {
            background: #764ba2;
            border: none;
        }
        .btn-custom:hover {
            background: #5a3c9c;
        }
    </style>
  </head>
  <body>

    <nav class="navbar navbar-expand-lg bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Tops Technologies</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">About us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'contact' %}" name="contact">Contact us</a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        {% if request.session.email %}
         <li class="nav-item">
            <a class="nav-link" href="{% url 'logout' %}" name="logout">logout({{request.session.fname}})</a>
         </li>
         <li class="nav-item">
            <a class="nav-link" href="{% url 'change-password' %}" name="change-password">Change password</a>
         </li>
         <li class="nav-item">
            <a class="nav-link" href="{% url 'profile' %}" name="profile">Profile</a>
         </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'signup' %}" name="signup">sign up</a>
            
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'login' %}" name="login">login </a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

{% block content %}
{% endblock%}


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" ></script>
  </body>
</html>
