{% extends 'header.html' %}

{% load static %}

{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>

    <main class="forgot-password-page split-layout">
        <!-- Left Section -->
        <section class="left-section">
            <div class="overlay"></div>
            <div class="glass-card">
                <div class="logo">
                    <img src="../static/img/logo/logo2_footer.png" alt="logo">
                </div>
                <h1 class="glow-text">Reset Your Password</h1>
                <p class="subtitle glow-text-soft">Enter your email and we will send you a reset link.</p>
            </div>
        </section>

        <!-- Right Section -->
        <section class="right-section">
            <div class="form-container">
                <div class="form-header">
                    <h2>Forgot Password</h2>
                    <p>Remember your password? <a href="{% url 'login' %}" class="signup-link">Back to Login</a></p>
                </div>

                <form method="post" action="{% url 'forgot-password' %}">
                    {% csrf_token %}
                    <!-- Email Input -->
                    <div class="input-group-custom">
                        <input type="email" name="email" class="form-control custom-input" placeholder="Email Address" required>
                        <i class="bi bi-envelope input-icon"></i>
                    </div>

                    <!-- Reset Password Button -->
                    <button type="submit" class="btn btn-primary-custom w-100">Send OTP</button>
                    
                </form>
            </div>
        </section>
    </main>
</body>
</html>

{% endblock %}
