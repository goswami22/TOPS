{% extends 'header.html' %}

{% load static %}

{% block content %}


<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
    <main class="login-page split-layout">
        <!-- Left Section -->
        <section class="left-section">
            <div class="overlay"></div>
            <div class="glass-card">
                <div class="logo">
                    <i class="bi bi-hospital"></i> Medical.
                </div>
                <h1 class="glow-text">Welcome Back</h1>
                <p class="subtitle glow-text-soft">Login to continue and manage your account</p>
            </div>
        </section>

        <!-- Right Section -->
        <section class="right-section">
            <div class="form-container">
                <div class="form-header">
                    <h2>Login</h2>
                    <p>Don't have an account? <a href="{% url 'signup' %}" class="signup-link">Sign Up</a></p>
                </div>
                {% if msg %}
                    <p class="text-success">{{ msg }}</p>
                {% endif %}
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <!-- Email Input -->
                    <div class="input-group-custom">
                        <input type="email" class="form-control custom-input" name="email" placeholder="Email Address" required>
                        <i class="bi bi-envelope input-icon"></i>
                    </div>

                    <!-- Password Input -->
                    <div class="input-group-custom">
                        <input type="password" class="form-control custom-input password-input"  name="password" id="password"
                            placeholder="Password" required>
                        <i class="bi bi-lock-fill input-icon"></i>
                        <i class="bi bi-eye-slash toggle-password" id="togglePassword"></i>
                    </div>

                    <!-- Options -->
                    <div class="form-options d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe" required>
                            <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
                        </div>
                        <a href="{% url 'forgot-password'  %}" class="forgot-link">Forgot password?</a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn btn-primary-custom w-100">Login</button>

                    <!-- Divider -->
                    <div class="divider">
                        <span>Or login with</span>
                    </div>

                    <!-- Social Login -->
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <button type="button" class="btn-social w-100 py-3 d-flex align-items-center justify-content-center gap-2">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" width="20">
                                <span>Google</span>
                            </button>
                        </div>
                        <div class="col-sm-6">
                            <button type="button" class="btn-social w-100 py-3 d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-apple fs-4"></i>
                                <span>Apple</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
{% endblock %}
