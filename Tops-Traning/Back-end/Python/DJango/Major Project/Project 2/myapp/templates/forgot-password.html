{% extends 'header.html' %}
{% load static %}
{% block content %}

<main class="account-content">

    <!-- Breadcrumb -->
    <section class="breadcrumb-wrapper">
        <div class="breakcrumb-content">
            <h2 class="breadcrumb-title">forgot Password</h2>

            <nav aria-label="breadcrumb">
                <div class="container-fluid px-0 overflow-hidden">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">
                            <a href="/">Home</a>
                        </li>
                        <li class="breadcrumb-item active" aria-current="page">
                            forgot Password
                        </li>
                    </ol>
                </div>
            </nav>
        </div>
    </section>

    <!-- forgot Password Form -->
    <section class="user-account py-5">
        <div class="container">
            <div class="login-wrapper">

                {% if msg %}
                <div class="alert alert-success">
                    {{ msg }}
                </div>
                {% endif %}

                <form action="{% url 'forgot-password' %}" method="post">
                    {% csrf_token %}

                    <h2 class="title text-center mb-4">
                        forgot Password
                    </h2>

                    <div class="form-top">

                        <!-- Email -->
                          <div class="mb-3">
                            <input type="email"
                                   class="form-control"
                                   name="email"
                                   placeholder="Enter email"
                                   required>
                        </div>

                        <!-- Submit -->
                        <div class="text-center">
                            <button type="submit"
                                name="send_otp"
                                class="btn btn-primary">
                            Send OTP
                        </button>
                        </div>
                    </div>

                    <div class="form-bottom mt-3 text-center">
                        <a href="{% url 'login' %}">
                            Back to Login
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </section>

</main>

{% endblock %}
