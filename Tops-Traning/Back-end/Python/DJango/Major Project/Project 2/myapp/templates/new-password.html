<!-- change-password.html -->

{% extends 'header.html' %}
{% block content %}

<section class="user-account py-5">
    <div class="container">
        <div class="login-wrapper">
            
            {% if msg %}
            <div class="alert alert-success">
                {{ msg }}
            </div>
            {% endif %}

            <form method="post" action="{% url 'new-password' %}">
                {% csrf_token %}

                <h2 class="text-center mb-4">
                    Change Password
                </h2>

                <div class="mb-3">
                    <input type="password"
                           name="new-password"
                           class="form-control"
                           placeholder="New Password"
                           required>
                </div>

                <div class="mb-3">
                    <input type="password"
                           name="confirm-password"
                           class="form-control"
                           placeholder="Confirm Password"
                           required>
                </div>

                <div class="text-center">
                    <button type="submit"
                            class="btn btn-primary">
                        Update Password
                    </button>
                </div>

            </form>

        </div>
    </div>
</section>

{% endblock %}
