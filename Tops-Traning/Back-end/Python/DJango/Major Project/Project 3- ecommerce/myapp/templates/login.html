
{% extends 'header.html' %}
{% load static %}
{% block content %}

<div class="breadcrumb-area space-top">
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Login</li>
            </ol>
        </nav>
    </div>
</div>

<section class="login-section space-top space-bottom">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">
                <div class="login-card">

                    <h2 class="login-title text-center">Login</h2>

                    {% if msg %}
                        <p class="text-success text-center">{{ msg }}</p>
                    {% endif %}

                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}

                        <div class="mb-3">
                            <input type="email"name="email" class="form-control" placeholder="Email Address" required>
                        </div>

                        <div class="mb-3">
                            <input type="password" name="password" class="form-control" placeholder="Password" required>
                        </div>

                        <div class="d-grid mb-3">
                            <input type="submit" class="main-btn mt-0" value="Login">
                        </div>

                        <div class="d-flex justify-content-between extra-links">
                            <a href="{% url 'forgot-password' %}">Forgot Password?</a>
                            <a href="{% url 'signup' %}">Create Account</a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</section>
{% endblock %}
