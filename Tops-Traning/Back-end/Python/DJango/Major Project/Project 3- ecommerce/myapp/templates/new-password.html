{% extends 'header.html' %}
{% load static %}
{% block content %}

<div class="breadcrumb-area space-top">
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Reset Password</li>
            </ol>
        </nav>
    </div>
</div>

<section class="login-section space-top space-bottom">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">
                <div class="login-card">

                    <h2 class="login-title text-center">Create New Password 🔑</h2>

                    {% if msg %}
                        <p class="text-success text-center">{{ msg }}</p>
                    {% endif %}

                    <form method="post" action="{% url 'new-password' %}">
                        {% csrf_token %}

                        <div class="mb-3">
                            <input type="password" name="new_password" class="form-control" placeholder="New Password" required>
                        </div>

                        <div class="mb-3">
                            <input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required>
                        </div>

                        <div class="d-grid mb-3">
                            <input type="submit" class="main-btn mt-0" value="Update Password">
                        </div>

                        <div class="text-center extra-links">
                            <a href="{% url 'login' %}">Back to Login</a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</section>

{% endblock %}
