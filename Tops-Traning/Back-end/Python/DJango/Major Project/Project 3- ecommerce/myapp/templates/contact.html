{% extends 'header.html' %}
{% load static %}
{% block content %}

<div class="breadcrumb-area space-top space-bottom">
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">contact</li>
            </ol>
        </nav>
    </div>
</div>

<div class="g-map">
    <div class="container">
        <div class="g-map-wrapper">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d235014.29918865065!2d72.41492971537376!3d23.020158084113362!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x395e848aba5bd449%3A0x4fcedd11614f6516!2sAhmedabad%2C%20Gujarat!5e0!3m2!1sen!2sin!4v1772382480960!5m2!1sen!2sin"
                width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
    </div>
</div>

<div class="contact-form space-top space-bottom">
    <div class="container">
        <div class="contact-form-wrapper">
            <div class="section-header border-0">
                <h2 class="title">Contact Us</h2>
            </div>
            <div class="form">
                {% if msg %}
                <p class="text-success mb-2">{{msg}}</p>
                {% endif %}
                <form action="{% url 'contact' %}" method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6">
                            <div class="field">
                                <input type="text" class="form-control" name="name" placeholder="Full Name">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="field">
                                <input type="email" class="form-control" name="email" placeholder="Email">
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="field">
                                <input type="text" class="form-control" name="subject" placeholder="subject">
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="field">
                            <textarea class="form-control" name="message" placeholder="Write your message" cols="25"
                                rows="10"></textarea>
                        </div>
                    </div>

                    <div class="field text-end">
                        <input type="submit" class="main-btn" value="SUBMIT">
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
