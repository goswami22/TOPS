{% extends 'header.html' %}
{% load static %}
{% block content %}

<div class="breadcrumb-area space-top">
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Sign Up</li>
            </ol>
        </nav>
    </div>
</div>

<div class="signup-form space-top space-bottom">
    <div class="container">
        <div class="signup-form-wrapper">
            <div class="section-header border-0">
                <h2 class="title">Sign up</h2>
            </div>
            <div class="form">
                {% if msg %}
                <p class="text-success mb-2">{{msg}}</p>
                {% endif %}
                <form action="{% url 'signup' %}" method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6">
                            <div class="field">
                                <input type="text" class="form-control" name="fname" placeholder="First Name">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="field">
                                <input type="text" class="form-control" name="lname" placeholder="Last Name">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="field">
                                <input type="email" class="form-control" name="email" placeholder="Email">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="field">
                                <input type="number" class="form-control" name="mobile"
                                    placeholder="Enter Your Mobile Number">
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="field">
                            <input type="file" class="form-control" name="profile_picture" placeholder="Choose your picture">
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="field">
                            <textarea name="address" placeholder="Enter Your address" class="form-control" rows="6"></textarea>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="field">
                            <input type="password" class="form-control" name="password" placeholder="Enter password">
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="field">
                            <input type="password" class="form-control" name="c_password"
                                placeholder="Enter Confirm password">
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <input type="checkbox" name="condition" required> Accept Our Terms & Conditions
                    </div>

                    <div class="field text-end">
                        <input type="submit" class="main-btn" value="SUBMIT">
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
