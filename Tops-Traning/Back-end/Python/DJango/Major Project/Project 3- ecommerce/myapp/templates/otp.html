
{% extends 'header.html' %}
{% load static %}
{% block content %}

<div class="breadcrumb-area space-top">
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">OTP Varification</li>
            </ol>
        </nav>
    </div>
</div>

<section class="login-section space-top space-bottom">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">
                <div class="login-card">

                    <h2 class="login-title text-center">Verify OTP</h2>

                    {% if msg %}
                        <p class="text-success text-center">{{ msg }}</p>
                    {% endif %}

                    <form method="post" action="{% url 'Verify-OTP' %}">
                        {% csrf_token %}

                        <div class="mb-3">
                            <input type="text"name="otp" class="form-control text-center" placeholder="Enter 6 Digit OTP" maxlength="6" required>
                        </div>

                        <div class="d-grid mb-3">
                            <input type="submit" class="main-btn mt-0" value="Verify OTP">
                        </div>

                        <div class="d-flex justify-content-between extra-links">
                            <a href="#">Resend OTP</a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</section>
{% endblock %}
