
{% extends 'header.html' %}
{% load static %}
{% block content %}

<div class="breadcrumb-area space-top">
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Forgot Password</li>
            </ol>
        </nav>
    </div>
</div>

<section class="login-section space-top space-bottom">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">
                <div class="login-card">

                    <h2 class="login-title text-center">Forgot Password 🔐</h2>

                    {% if msg %}
                        <p class="text-danger text-center">{{ msg }}</p>
                    {% endif %}

                    <form method="post" action="{% url 'forgot-password' %}">
                        {% csrf_token %}

                       <div class="mb-3 position-relative">
                                <input type="email" class="form-control custom-input" name="email" placeholder="Enter your registered email" required>
                            </div>

                            <!-- Button -->
                            <div class="d-grid">
                                <button type="submit" class="btn login-btn">
                                    Send Reset Link
                                </button>
                            </div>

                            <!-- Back to login -->
                            <p class="text-center mt-4 small">
                                Remember your password?
                                <a href="{% url 'login' %}" class="signup-link">Back to Login</a>
                            </p>

                    </form>

                </div>
            </div>

        </div>
    </div>
</section>
{% endblock %}
