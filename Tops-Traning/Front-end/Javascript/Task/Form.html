<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <h3 class="text-center mb-4">Form Validation</h3>
                    <form action="" onsubmit="return validation()">
                        <div class="mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" id="fname" placeholder="Enter First Name">
                            <span id="ferr"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lname" placeholder="Enter Last Name">
                            <span id="lerr"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter Email">
                            <span id="eerr"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" placeholder="Enter Phone Number">
                            <span id="pherr"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea class="form-control" rows="4" id="Address" placeholder="Enter Address"></textarea>
                            <span id="adderr"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Enter password">
                            <span id="pserr"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="cpassword" placeholder="Enter password">
                            <span id="cpserr"></span>
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-primary">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>


    <script>

        function validation() {

            let fname = document.getElementById("fname");
            let lname = document.getElementById("lname");
            let email = document.getElementById("email");
            let phone = document.getElementById("phone");
            let address = document.getElementById("Address");
            let password = document.getElementById("password");
            let cpassword = document.getElementById("cpassword");

            let ferr = document.getElementById("ferr");
            let lerr = document.getElementById("lerr");
            let eerr = document.getElementById("eerr");
            let pherr = document.getElementById("pherr");
            let adderr = document.getElementById("adderr");
            let pserr = document.getElementById("pserr");
            let cpserr = document.getElementById("cpserr");


            if (fname.value == "" || fname.value == null) {
                ferr.innerHTML = "Please Enter First Name";
                ferr.style.color = "red";
                fname.style.border = "1px solid red";
                return false;
            } else {
                ferr.innerHTML = "";
            }


            if (lname.value == "" || lname.value == null) {
                lerr.innerHTML = "Please Enter Last Name";
                lerr.style.color = "red";
                lname.style.border = "1px solid red";
                return false;
            } else {
                lerr.innerHTML = "";
            }


            if (email.value == "" || email.value == null) {
                eerr.innerHTML = "Please Enter Email";
                eerr.style.color = "red";
                email.style.border = "1px solid red";
                return false;
            } else {
                eerr.innerHTML = "";
            }


            if (phone.value == "" || phone.value == null) {
                pherr.innerHTML = "Enter Phone Number";
                pherr.style.color = "red";
                phone.style.border = "1px solid red";
                return false;
            } else {
                pherr.innerHTML = "";
            }


            if (address.value == "" || addess.value == null) {
                adderr.innerHTML = "Please Enter Address";
                adderr.style.color = "red";
                address.style.border = "1px solid red";
                return false;
            } else {
                adderr.innerHTML = "";
            }


            if (password.value == "" || password.value == null) {
                pserr.innerHTML = "Please Enter Password";
                pserr.style.color = "red";
                password.style.border = "1px solid red";
                return false;
            }
            else {
                pserr.innerHTML = "";

            }

            if (cpassword.value == "" || cpassword.value == null) {
                cpserr.innerHTML = "Please Enter confirm Password";
                cpserr.style.color = "red";
                password.style.border = "1px solid red";
                return false;
            }
            else {
                cpserr.innerHTML = "";
            }

            if (password.value != cpassword.value) {
                alert("Password & Confirm Password not match");
                return false;

            }
        }
    </script>



</body>

</html>
