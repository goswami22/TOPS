<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Calculator</title>
</head>

<body>

    <div class="calculator">
        <div class="calculator-wrapper">
            <input id="show-result" type="tel">
            <div class="field-area">
                <div class="field-button">
                    <button onclick="showValue(1)">1</button>
                    <button onclick="showValue(2)">2</button>
                    <button onclick="showValue(3)">3</button>
                    <button onclick="showValue(4)">4</button>
                    <button onclick="showValue(5)">5</button>
                    <button onclick="showValue(6)">6</button>
                    <button onclick="showValue(7)">7</button>
                    <button onclick="showValue(8)">8</button>
                    <button onclick="showValue(9)">9</button>
                    <button onclick="showValue(0)">0</button>
                </div>

                <div class="field-symbol">
                    <button id="sum" onclick="showValue('+')">+</button>
                    <button id="sub" onclick="showValue('-')">-</button>
                    <button id="multi" onclick="showValue('*')">*</button>
                    <button id="div" onclick="showValue('/')">/</button>
                    <button id="mod" onclick="showValue('%')">%</button>
                    <button id="mod" onclick="calculate('=')">=</button>
                    <button id="clear" onclick="clearDisplay('c')">c</button>
                </div>

            </div>
        </div>
    </div>  
    <script>

        function showValue(value) {
            let showValue = document.getElementById('show-result');
            showValue.value += value;
        }

        function calculate() {
            let finalResult = document.getElementById('show-result').value;
            document.getElementById('show-result').value = eval(finalResult);
        }

        function clearDisplay() {
            document.getElementById('show-result').value = "";
        }

    </script>


</body>
