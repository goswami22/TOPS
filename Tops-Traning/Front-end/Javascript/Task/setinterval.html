<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setinterval</title>
</head>
<body>
    

    <h1>Counter</h1>
    <h2 id="h1"></h2>


    <script>
        let a = setInterval(demo, 10)
        let count = 0

        function demo(){
            
            let h1_tag = document.getElementById("h1")

                h1_tag.innerHTML =  ++count 

            if(count == 350){
                clearInterval(a)
            }


        }
    </script>

</body>
</html>
