<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object</title>
</head>
<body>
    

    <h1>Object</h1>

    <script>

        let person = {
            name:'Bhavesh',
            age : 28,
            address : "Ahmedabad",
            course : [
                "Front-end",
                "Back-end"
            ]
        }

        console.log(person.name)  //    accessing the value of the name property using dot notation
        console.log(person.course[1])

        console.log(person.address= "Surat")
        console.log(person)
        console.log(person["address"] = "Rajkot")
        console.log(person)

        delete person.age           // deletes the age property from the person object
        console.log(person) 

        console.log("function in onbject")
        let user = {
            name: "Rohan",
            age : 30,
            greet : function(){
                console.log("hello " + this.name)    ///    this keyword means currennt object
            }
        }

        user.greet()


        let student = {
            name : "Mayank",
            age : 22,
            courses : {
                course1 : "Fornt-end",
                course2 : "Back-end"
            } 
        }

        console.log(student.name + " " + student.courses.course1)

        let users = [
            {
                id : 1,
                name : "Rohan"
            },
            {
                id : 2,
                name : "Mayank"
            }
        ]

        console.log(users[0].name)

        for(let key in person){
            console.log(key+ ":"+ person[key])
        }

        // Object of keys
        console.log(Object.keys(person))

        // Object of values
        console.log(Object.values(person))

        // object of entries
        console.log(Object.entries(person))

        // Destructuring
        let {name, age} = person
        console.log(name)
        console.log(age)
        // without using destructuring
        let name1 = person.name
        console.log(name1)
        let age1 = person.age
        console.log(age1)


        let personInfo = {...person}        // Spread operator is used to create a new object by copying the properties of an existing object. It allows you to create a new object with the same properties as the original object, without modifying the original object.
        console.log(personInfo)


        let respons = {
            status : true,
            data : {
                name: "Bhavesh",
                skills : ["html", "Css"]
            }
        }

        console.log(respons.data.skills[0])




    </script>





</body>
</html>
