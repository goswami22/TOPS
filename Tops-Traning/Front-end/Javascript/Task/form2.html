<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
</head>

<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <h3 class="text-center mb-4">Form Validation</h3>
                    <form action="" onsubmit="return form_validation()">
                        <div class="mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" onblur="return validation(fname,ferr)" class="form-control" id="fname"
                                placeholder="Enter First Name">
                            <span id="ferr"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" onblur="return validation(lname,lerr)" id="lname"
                                placeholder="Enter Last Name">
                            <span id="lerr"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" onblur="return validation(email,eerr)" id="email"
                                placeholder="Enter Email">
                            <span id="eerr"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" onblur="return validation(phone,pherr)"
                                placeholder="Enter Phone Number">
                            <span id="pherr"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea class="form-control" rows="4" id="address"
                                onblur="return validation(address,adderr)" placeholder="Enter Address"></textarea>
                            <span id="adderr"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" onblur="return validation(password,pserr)"
                                id="password" placeholder="Enter password">
                            <span id="pserr"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="cpassword" placeholder="Enter password">
                            <span id="cpserr"></span>
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-primary">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>


    <script>

        function validation(intp, err) {
            if (intp.value == "" || intp.value == null) {
                err.innerHTML = "Please fill details"
                err.style.color = 'red'
                intp.style.border = '1px solid red'
                return false
            }
            else {
                err.innerHTML = ""
                intp.style.border = '1px solid green'
            }


        }
        function form_validation() {
            if (password.value != cpassword.value) {
                alert("Password & confirm password Doesn't match")
                return false
            }
        }

    </script>

</body>

</html>
