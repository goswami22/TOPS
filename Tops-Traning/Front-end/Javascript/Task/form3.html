    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <h3 class="text-center mb-4">Form Validation</h3>
                    <form action="" onsubmit="return form_validation()">
                        <div class="mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" id="fname" placeholder="Enter First Name">
                            <span id="ferr"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lname" placeholder="Enter Last Name">
                            <span id="lerr"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter Email">
                            <span id="eerr"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" placeholder="Enter Phone Number">
                            <span id="pherr"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea class="form-control" rows="4" id="address" placeholder="Enter Address"></textarea>
                            <span id="adderr"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Enter password">
                            <span id="pserr"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="cpassword" placeholder="Enter password">
                            <span id="cpserr"></span>
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-primary">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <script>
function form_validation() {

    let fname = document.getElementById("fname");
    let lname = document.getElementById("lname");
    let email = document.getElementById("email");
    let phone = document.getElementById("phone");
    let address = document.getElementById("address");
    let password = document.getElementById("password");
    let cpassword = document.getElementById("cpassword");

    let ferr = document.getElementById("ferr");
    let lerr = document.getElementById("lerr");
    let eerr = document.getElementById("eerr");
    let pherr = document.getElementById("pherr");
    let adderr = document.getElementById("adderr");
    let pserr = document.getElementById("pserr");
    let cpserr = document.getElementById("cpserr");

    let nameRegex = /^[a-zA-Z]+$/;
    let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    let phoneRegex = /^[0-9]{10}$/;
    let passRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;


    // First Name
    if (fname.value == "") {
        ferr.innerHTML = "First name is required";
        ferr.style.color = "red"
        return false;
    } else if (!nameRegex.test(fname.value)) {
        ferr.innerHTML = "Only letters allowed";
        return false;
    } else {
        ferr.innerHTML = "";
    }

    // Last Name
    if (lname.value == "") {
        lerr.innerHTML = "Last name is required";
        lerr.style.color = "red"
        return false;
    } else if (!nameRegex.test(lname.value)) {
        lerr.innerHTML = "Only letters allowed";
        return false;
    } else {
        lerr.innerHTML = "";
    }

    // Email
    if (email.value == "") {
        eerr.innerHTML = "Email is required";
        eerr.style.color = "red"
        return false;
    } else if (!emailRegex.test(email.value)) {
        eerr.innerHTML = "Invalid email";
        return false;
    } else {
        eerr.innerHTML = "";
    }

    // Phone
    if (phone.value == "") {
        pherr.innerHTML = "Phone is required";
        pherr.style.color = "red"
        return false;
    } else if (!phoneRegex.test(phone.value)) {
        pherr.innerHTML = "Enter valid 10 digit number";
        return false;
    } else {
        pherr.innerHTML = "";
    }

    // Address
    if (address.value.trim() == "") {
        adderr.innerHTML = "Address required";
        adderr.style.color = "red"
        return false;
    } else {
        adderr.innerHTML = "";
    }

    // Password
    if (password.value == "") {
        pserr.innerHTML = "Password required";
        return false;
    } else if (!passRegex.test(password.value)) {
        pserr.innerHTML = "Weak password";
        return false;
    } else {
        pserr.innerHTML = "";
    }

    // Confirm Password
    if (cpassword.value == "") {
        cpserr.innerHTML = "Confirm password required";
        return false;
    } else if (password.value != cpassword.value) {
        cpserr.innerHTML = "Passwords do not match";
        return false;
    } else {
        cpserr.innerHTML = "";
    }

    return true; // ✅ only here
}
</script>
</body>
