<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Fake User API</title>
</head>

<body>


    <div class="container">
        <div class="row">
            
        </div>
    </div>

    <script>
        fetch('https://fake-json-api.mock.beeceptor.com/users', {
            method: 'GET'
        })
            .then((data) => {
                return data.json()
            })
            .then((res) => {
                console.log(res)

                for (let user of res) {
                    let userData =
                        `
                            <div class="col-md-3 col-lg-4">
                                <div class="card">
                                    <img src="${user.photo}" alt="image" class="img-fluid">
                                    <p>${user.id}</p>
                                    <h5>${user.name}</h5>
                                    <p>${user.name}</p>
                                    <p>${user.phone}</p>
                                    <p>${user.country}</p>
                                    <p>${user.state}</p>
                                </div>
                            </div>

                        `
                        document.querySelector('.row').innerHTML += userData

                }

            })



    </script>




</body>

</html>
