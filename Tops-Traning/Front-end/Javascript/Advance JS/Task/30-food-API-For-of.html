<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food API</title>
</head>
<body>

    <table border="1" cellpadding="10" cellspacing="10" style="border-collapse: collapse;">
        <thead>
            <tr>
                <th>Id</th>
                <th>Dish</th>
                <th>Restaurant</th>
                <th>Drink</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>


    <script>
        fetch('https://api.mydummyapi.com/categories/food', {
            method: 'GET'
        })
        .then((data)=>{
            return data.json()
        })
        .then((res)=>{
            console.log(res)

            for(let food of res){
                let foodData = 
                `
                    <tr>
                        <td>${food.id}</td>    
                        <td>${food.dish}</td>    
                        <td>${food.drink}</td>    
                        <td>${food.restaurant}</td>    
                        <td>${food.price}</td>    
                    </tr>
                
                `
                document.querySelector('tbody').innerHTML += foodData

            }
        })


    </script>

</body>
</html>
