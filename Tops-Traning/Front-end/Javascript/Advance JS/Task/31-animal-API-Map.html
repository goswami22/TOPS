<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" >
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" ></script>
    <title>animal API Map</title>
</head>
<body>
    
    <div class="container">
        <div class="row">
            
        </div>
    </div>

    <script>
        fetch('https://api.mydummyapi.com/categories/animals',{
            method: 'GET'
        })
        .then((data)=>{
            return data.json()
        })
        .then((res)=> {
            console.log(res)
            let animalData = res.map((animal, index)=>{
                return(
                    `
                        <div class="col-md-6 col-lg-3 mb-4">
                            <div class="card">
                                <img src="${animal.image}" alt="image">
                                <p>${animal.id}</p>
                                <p>${animal.type}</p>
                                <h3>${animal.name}</h3>
                                <p>${animal.habitat}</p>
                            </div>
                        </div>
                    `
                )
            })
            document.querySelector('.row').innerHTML += animalData.join('')
        })


    </script>

</body>
</html>
