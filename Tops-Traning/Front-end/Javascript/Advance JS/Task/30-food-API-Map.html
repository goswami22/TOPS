<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-food API Map</title>
</head>
<body>

    <table cellspacin="0" cellpadding="10" border="1" style="border-collapse:collapse">
        <thead>
            <tr>
                <th>Id</th>
                <th>dish</th>
                <th>Drink</th>
                <th>Restaurant</th>
                <th>price</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>


    <script>

        fetch('https://api.mydummyapi.com/categories/food',{
            method: 'GET'
        })
        .then((data)=>{
            return data.json()
        })
        .then((res)=>{

            console.log(res)

            let foodData = res.map((food, index)=>{
                return(
                    `
                    <tr>
                        <td>${food.id}</td>
                        <td>${food.dish}</td>
                        <td>${food.drink}</td>
                        <td>${food.restaurant}</td>
                        <td>${food.price}</td>
                    </tr>    
                    
                    `
                )
            })
            document.querySelector('tbody').innerHTML += foodData.join('')

        })

    </script>

</body>
</html>
