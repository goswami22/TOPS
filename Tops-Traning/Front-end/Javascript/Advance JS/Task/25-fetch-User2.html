<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Dummy user - map </title>
</head>
<body>
    
    <table class="table">
        <thead>
            <tr>
                <th>Id</th>
                <th>image</th>
                <th>firstName</th>
                <th>lastName</th>
                <th>age</th>
                <th>gender</th>
                <th>email</th>
                <th>phone</th>
                <th>birthDate</th>
                <th>city</th>
                <th>country</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>

        fetch('https://dummyjson.com/users',{
            method: 'GET'
        })
        .then((data)=>{
            return data.json()
        })
        .then((res)=>{
            // console.log(res)

           let usermap = res.users.map((user,index)=>{
                // console.log(user)
                return(
                    `<tr>
                        <td>${user.id}</td>
                        <td><img src="${user.image}" alt="image" width="80"></td>
                        <td>${user.firstName}</td>
                        <td>${user.lastName}</td>
                        <td>${user.age}</td>
                        <td>${user.gender}</td>
                        <td>${user.email}</td>
                        <td>${user.phone}</td>
                        <td>${user.birthDate}</td>
                        <td>${user.address.city}</td>
                        <td>${user.address.country}</td>
                    </tr>
                    `
                )
            })
            document.querySelector('tbody').innerHTML += usermap.join('')


        })

    </script>



</body>
</html>
