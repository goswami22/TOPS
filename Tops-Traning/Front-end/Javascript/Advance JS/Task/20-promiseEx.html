<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise Exe</title>
</head>
<body>
    

    <script>

        function output(res){
            console.log(res)
        }

        let p = new Promise((res, rej)=> {
            let x = 15
            if(x == 16){
                res('Successfully')
            }else {
                rej('Reject')
            }
        })
        .then((data)=>{
            output(data)
        })
        .catch((data)=>{
            output(data)
        })

        console.log(p)



    </script>




</body>
</html>
