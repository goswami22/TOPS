<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products API</title>
</head>
<body>


    <table border="1" cellspacing="10" cellpadding="10" style="border-collapse: collapse;">
        <thead>
            <tr>
                <td>Id</td>
                <td>Name</td>
                <td>Price</td>
                <td>Department</td>
                <td>Description</td>
                <td>Image</td>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>


    <script>
        fetch('https://api.mydummyapi.com/categories/products',{
            method: 'GET'
        })
        .then((data)=> {
            return data.json()
        })
        .then((res)=>{
            console.log(res)

            res.forEach((product, index) => {
                

                let tbody = document.querySelector('tbody')
                let trow = tbody.insertRow()

                let id = trow.insertCell(0)
                let name = trow.insertCell(1)
                let price = trow.insertCell(1)
                let department = trow.insertCell(1)
                let description = trow.insertCell(1)
                let image = trow.insertCell(1)



                id.textContent = product.id
                name.textContent = product.name
                price.textContent = product.price
                department.textContent = product.department
                description.textContent = product.description
                
                image.innerHTML = `<img src="${product.image}" alt="image" width="100">`

            });

        })



    </script>




</body>
</html>
