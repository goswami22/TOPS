<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food API</title>
</head>
<body>

    <table border="1" cellpadding="10" cellspacing="10" style="border-collapse: collapse;">
        <thead>
            <tr>
                <th>Id</th>
                <th>Dish</th>
                <th>Restaurant</th>
                <th>Drink</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>


    <script>

        fetch('https://api.mydummyapi.com/categories/food', {
            method: 'GET'
        })
        .then((data)=>{
            return data.json()
        })
        .then((res)=>{

           console.log(res)

           res.forEach((food, index) => {

            let tbody = document.querySelector('tbody')
            let trow = tbody.insertRow()

            let id = trow.insertCell(0)
            let dish = trow.insertCell(1)
            let restaurant = trow.insertCell(2)
            let drink = trow.insertCell(3)
            let price = trow.insertCell(4)
            
            id.textContent = food.id
            dish.textContent = food.dish
            restaurant.textContent = food.restaurant
            drink.textContent = food.drink
            price.textContent = food.price
        });


        })
        .catch((err)=>{
            console.log('Reject')
        })


    </script>

</body>
</html>
