<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <title>Weather API</title>



    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #222;
        }

        .card {
            width: 90%;
            max-width: 600px;
            background: linear-gradient(135deg, #00feba, #5b548a);
            color: #fff;
            margin: 100px auto 0;
            border-radius: 20px;
            padding: 40px 35px;
            text-align: center;
        }

        .search {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;

        }

        .search input {
            border: 0;
            outline: 0;
            background: #ebfffc;
            color: #555;
            padding: 10px 25px;
            height: 60px;
            width: 100%;
            border-radius: 30px;
            margin-right: 16px;
            font-size: 18px;
        }

        .search button {
            border: 0;
            outline: 0;
            border-radius: 50%;
            width: 70px;
            height: 60px;
            cursor: pointer;
        }

        .search button img {
            width: 16px;
        }

        .weather-icon {
            width: 170px;
            margin-top: 30px;
        }

        .weather h1 {
            font-size: 80px;
            font-weight: 500;
        }

        .weather h2 {
            font-size: 45px;
            font-weight: 400;
            margin-top: -10px;
        }

        .details {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            margin-top: 50px;
        }

        .col {
            display: flex;
            align-items: center;
            text-align: left;
        }

        .col img {
            width: 40px;
            margin-right: 10px;
        }

        .humidity,
        .wind {
            font-size: 28px;
        }

        .weather {
            display: none;
        }
        .weather-icon {
            width: 100px;
        }
    </style>
</head>

<body>



    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter city name" spellcheck="false">
            <button class="btn btn-danger"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="weather">
            <img src="" class="weather-icon">
            <h1 class="temp">22</h1>
            <h2 class="city">new york</h2>
            <div class="details">
                <div class="col">
                    <img src="image/humidity.png" alt="">
                    <div>
                        <p class="humidity mb-0">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="image/wind.png" alt="">
                    <div>
                        <p class="wind mb-0">15 Km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let apikey = 'abcc48b3fffbd8d02816543332c6d932';

        let apiid = 'https://api.openweathermap.org/data/2.5/weather?&units=metric&q='


        let searchinput = document.querySelector('input')
        let button = document.querySelector('button')

        async function weather(city) {
            const res = await fetch(apiid + city + `&appid=${apikey}`);
            const result = await res.json()
            console.log(result)


            document.querySelector(".city").innerHTML = result.name
            document.querySelector(".temp").innerHTML = Math.round(result.main.temp) + "°C";
            document.querySelector(".humidity").innerHTML = result.main.humidity + " %";
            document.querySelector(".wind").innerHTML = result.wind.speed + " Km/h";

            document.querySelector(".weather").style.display = "block"


            let icon = result.weather[0].icon;

            let weatherIcon =
                document.querySelector(".weather-icon");

            if (icon.includes("d")) {
                weatherIcon.src = "image/clear.png";
            }
            else {
                weatherIcon.src = "image/night-mode.png";
            }

        }


        button.addEventListener('click', () => {
            weather(searchinput.value)
        })



    </script>

</body>

</html>
