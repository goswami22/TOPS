<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal API </title>
</head>
<body>
    
    <table border="1" cellpadding="10" cellspacing="10" style="border-collapse: collapse;">
        <thead>
            <tr>
                <th>Id</th>
                <th>Type</th>
                <th>Name</th>
                <th>habitat</th>
                <th>image</th>
            </tr>
        </thead>

        <tbody>

        </tbody>
    </table>

    <script>

        fetch('https://api.mydummyapi.com/categories/animals',{
            method: 'GET'
        })
        .then((data)=> {
            return data.json()
        })
        .then((res)=>{
            console.log(res)

            res.forEach((animal, index) => {
                let tbody = document.querySelector('tbody')
                let trow =tbody.insertRow()

                let id =trow.insertCell(0)
                let type =trow.insertCell(1)
                let name =trow.insertCell(2)
                let habitat =trow.insertCell(3)
                let image =trow.insertCell(4)


                id.textContent = animal.id
                type.textContent = animal.type
                name.textContent = animal.name
                habitat.textContent = animal.habitat
                image.innerHTML  = `<img src="${animal.image}" alt="image" width='150'>`




            });

        })

    </script>



</body>
</html>
