<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>business API Map</title>
</head>

<body>


    <table cellspacin="0" cellpadding="10" border="1" style="border-collapse:collapse">
    <thead>
        <tr>
            <th>Id</th>
            <th>Company</th>
            <th>Industry</th>
            <th>catchPhrase</th>
            <th>address</th>
        </tr>
    </thead>
    <tbody>
        
    </tbody>
</table>

<script>
    fetch('https://api.mydummyapi.com/categories/business',{
        method: 'GET'
    })
    .then((data)=>{
        return data.json()
    })
    .then((res)=>{
        console.log(res)
        
        for(let business of res){
            // console.log(business)
            let bussinessData = 
            `
                <tr>
                    <td>${business.id}</td>    
                    <td>${business.company}</td>    
                    <td>${business.industry}</td>    
                    <td>${business.catchPhrase}</td>    
                    <td>${business.address}</td>    
                </tr>

            `
            document.querySelector('tbody').innerHTML += bussinessData

        }


    })



</script>




</body>

</html>
