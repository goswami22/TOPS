<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
</head>
<body>
    

    <script>

        let a = [1,2,23.5,'Bhavesh',false]

        console.log(a)
        console.log(a.length)
        console.log(a[3])
        a[0] = 'Raj';
        console.log(a)

        a.shift()
        console.log(a)

        a.unshift(1000)
        console.log(a)

        a.pop()
        console.log (a)

        a.push('bhavesh Goswami')
        console.log(a)
        





</script>


</body>
