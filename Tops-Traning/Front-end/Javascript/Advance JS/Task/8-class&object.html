        let bankBalance = 0
        class Bank {

            // data member

                let bankIFSC = 'HDFC00012'
                let bankPin = pin

                console.log('Bank IFSC :', bankIFSC)
                console.log('Bank Pin :', bankPin)
                console.log('Bank Amount :', bankBalance)
            }

            diposit = function depositAmount(damount){

                console.log('Total Bank Amount is: ', bankBalance)
            }

            withdrawal = function withdrawalAmount(wamount){

                    console.log('Remaining Balance is:', bankBalance)

                }

                }
            }
