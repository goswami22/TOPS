<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops</title>
</head>
<body>
    
    <script>
        let a = [1, 20, 2.3, 'Bhavesh', false, true]

        console.log(a)
        console.log(a.length)
        console.log(a[3])


        // for(let i = 0; i < a.length;i++){
        //     console.log(i +' : '+ a[i])
        // }

        // pass only value
        for(let  data of a){
            console.log(data)
        }

        // pass only index
        for(let data in a){
            console.log(data)
        }

    </script>


</body>
</html>
