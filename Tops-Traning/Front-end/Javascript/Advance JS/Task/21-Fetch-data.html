<body>

    =============================== chatgpt data =======================================
    fetch() is used to get data from an API or server.

    Simple meaning:

    Fetch means “bring data”.

    Why Fetch is Used?

    Used for:

    API calls
    Getting JSON data
    Sending data to server
    Login systems
    Weather apps
    Database communication

    Method	        Work
    GET	            Read data
    POST	        Send data
    PUT	            Update data
    DELETE	        Delete data


     -->

    <script>

        fetch('data.txt', {
            method: "GET"
        })
        .then((data)=> {
            return data.text()
        })
        .then((res)=>{
            console.log(res)
            document.write(`<h2>${res}</h2>`)
        })
        .catch((err)=>{
            console.log(err)
        })

    </script>


</body>
