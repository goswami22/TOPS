<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fetch - Cards </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>


  <div class="container">
    <div class="row">

    </div>
  </div>


  <script>

    fetch('https://dummyjson.com/carts', {
      method: 'GET'
    })
      .then((data) => {
        return data.json()
      })
      .then((res) => {
        console.log(res)

        for(let index of res.carts ) {
          // console.log(index)

          let cards =
            `
                <div class="col-sm-6 col-md-4 col-lg-3 mt-5">
                  <div class="card mb-4 position-relative h-100">
                    <span class="badge badge-danger position-absolute end-0 bg-danger">${index.products[0].discountPercentage}%</span>
                    <img src="${index.products[0].thumbnail}" class="card-img-top" alt="...">
                    <div class="card-body">
                      <h5 class="card-title"><a href="" class="text-decoration-none text-dark">${index.products[0].title}</a></h5>
                      <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's content.</p>
                      <p><strong>$${index.products[0].price}</strong></p>
                      <a href="#" class="btn btn-primary btn-block w-100 py-3 fs-5">Buy now</a>
                    </div>
                  </div>
                </div>
                
          `
          document.querySelector('.row').innerHTML += cards
          
        }
        





      });




  </script>







  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
