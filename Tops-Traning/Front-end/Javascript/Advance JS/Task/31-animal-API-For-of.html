<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Animal API </title>
</head>

<body>

    <div class="container">
        <div class="row">

        </div>
    </div>


    <script>

        fetch('https://api.mydummyapi.com/categories/animals', {
            method: 'GET'
        })
            .then((data) => {
                return data.json()
            })
            .then((res) => {
                console.log(res)

                for (let animal of res) {

                    let animalData =
                        `
                            <div class="col-md-4 col-lg-3">
                                <div class="card">
                                    <img src="${animal.image}" alt="img" class="img-fluid">
                                    <span>${animal.id}</span>
                                    <p>${animal.type}</p>
                                    <h4>${animal.name}</h4>
                                    <p>${animal.habitat}</p>
                                </div>
                            </div>

                        `



                    document.querySelector('.row').innerHTML += animalData
                }


            })



    </script>



</body>

</html>
