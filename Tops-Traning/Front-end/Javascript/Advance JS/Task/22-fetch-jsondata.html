<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Json Data</title>
</head>
<body>
    

    <script>

        fetch('data.json', {
            method: 'GET'
        })
        .then((data)=> {
            return data.json()
        })
        .then((res)=>{
            console.log(res)
            
                res.forEach((data) => {
                    console.log(data)
                });
        })
        .catch((err)=> {
            console.log(err)
        })


    </script>


</body>
</html>
