<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        console.log('multilevel inheritance')

        
        class A {
            x = function data(){
                console.log('X function')
            } 
        }

        class B extends A {
            y = function data2(){
                console.log('Y Function')
            }
        }

        class C extends B {
            z = function data3(){
                console.log('Z function')
            }
        } 

        const db2 = new C
        console.log(db2)

        db2.x()
        db2.y()
        db2.z()








    </script>
</body>
</html>
