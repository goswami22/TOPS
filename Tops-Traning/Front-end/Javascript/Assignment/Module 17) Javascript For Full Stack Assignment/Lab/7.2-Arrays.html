<!-- 
 Write a program to find the sum of all elements in an array of numbers.

 -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>
</head>

<body>

    <script>
        let num = [1,2,3,4,5]  
        let sum = 0

        num.forEach((data) => {
            sum +=  data
        })

        console.log(sum)



      
    </script>   

</body>

</html>
