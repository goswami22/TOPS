<!-- 
    Create a simple webpage with a button that, when clicked, displays an alert saying
    "Button clicked!" using JavaScript event listeners.


 -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Event</title>
</head>

<body>


    <button type="button" onclick="message()">Click</button>

    <script>

       function message(){
        alert('Button clicked!')
       }


    </script>

</body>

</html>
