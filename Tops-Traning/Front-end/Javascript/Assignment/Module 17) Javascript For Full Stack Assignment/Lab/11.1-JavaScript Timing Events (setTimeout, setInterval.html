<!-- 
    Write a program that changes the background color of a webpage after 5
    secondsusing setTimeout().


 -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
</head>

<body>

   

    <script>

      setTimeout(changeBg,5000)

      function changeBg(){
        document.body.style.background = 'linear-gradient(to right, red, yellow, blue)' 
      }

    </script>

</body>

</html>
