<!-- Write a do-while loop that continues to ask the user for input until they enter a
number greater than 10
 -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop</title>
</head>

<body>



    <script>

        let n

        do {
            n = Number(prompt("Enter Number Greater Than 10 "))

            console.log(n)
        } while (n >= 10)
       console.log("Valid Number Entered")
    </script>

</body>

</html>
