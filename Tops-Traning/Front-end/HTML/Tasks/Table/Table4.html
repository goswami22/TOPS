                        <th>Male</th>

                    </tr>
                    <tr>
                        <td>9908852652</td>
                        <td>9908852655</td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <th>Rural</th>
            <td>9685421145</td>
            <td>9685421146</td>
            <td align="center">9685421148</td>
        </tr>
    </table>
