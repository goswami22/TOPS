<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Product</title>
</head>

<body>
    <div class="contanier">
        <div class="row">
            <div class="col">
                <div class="product">
                    <div class="img-box">
                        <img src="m2.jpg" alt="product image" class="product-img">
                        <span class="new">New</span>
                        <a href="#" aria-label="quick view" class="btn-quick-view">Quick View</a>
                    </div>
                    <div class="content">
                        <h3 class="product-title">Gabi Full Sleeve Sweatshirt</h3>
                        <div class="price-box">
                            <span class="current-price">$49.99</span>
                            <span class="old-price">$69.99</span>
                        </div>
                        <a href="#" class="btn btn-cart">Add to Cart</a>
                    </div>
                </div>
            </div>
        </div>
    </div>


</body>

</html>
